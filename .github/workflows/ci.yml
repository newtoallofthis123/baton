name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: detect
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    outputs:
      format: ${{ steps.read.outputs.format }}
      lint: ${{ steps.read.outputs.lint }}
    steps:
      - name: Read iswear statuses on the head commit
        id: read
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.sha;
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { owner: context.repo.owner, repo: context.repo.repo, ref, per_page: 100 }
            );
            for (const check of ['format', 'lint']) {
              const status = statuses.find((s) => s.context === `iswear/${check}`);
              core.setOutput(check, status?.state === 'success' ? 'true' : 'false');
              core.info(`iswear/${check} on ${ref}: ${status?.state || 'missing'}`);
            }

  format:
    name: format
    needs: detect
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.detect.outputs.format != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: lint
    needs: detect
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.detect.outputs.lint != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: cargo test --locked

  pr-ready:
    name: pr-ready
    if: always() && github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    needs: [detect, format, lint, test]
    steps:
      - name: Evaluate sworn-or-CI per check
        env:
          EVENT: ${{ github.event_name }}
          SWORN_FORMAT: ${{ needs.detect.outputs.format }}
          SWORN_LINT: ${{ needs.detect.outputs.lint }}
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$EVENT" = "merge_group" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$TEST_RESULT" = "success" ]; then
              echo "Merge-tier checks passed."
              exit 0
            fi
            echo "::error ::Merge-tier checks did not pass (result: $TEST_RESULT). Attestation never applies here."
            exit 1
          fi

          ok=true
          for check in format lint; do
            sworn_var="SWORN_$(echo "$check" | tr a-z A-Z)"
            result_var="$(echo "$check" | tr a-z A-Z)_RESULT"
            if [ "${!sworn_var}" = "true" ]; then
              echo "$check: sworn locally."
            elif [ "${!result_var}" = "success" ]; then
              echo "$check: passed in CI."
            else
              echo "::error ::$check: not sworn and CI result is '${!result_var}'."
              ok=false
            fi
          done
          $ok
